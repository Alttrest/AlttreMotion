<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes scan {
      0% { transform: translateY(0); opacity: 0.8; }
      100% { transform: translateY(180px); opacity: 0; }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .grid-bg { fill: url(#grid); }
    .pulse-elem { animation: pulse 2.5s ease-in-out infinite; }
  </style>

  <rect width="1200" height="560" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="1200" height="560" rx="16" class="grid-bg" />

  <!-- Top Badge -->
  <g transform="translate(60, 45)">
    <rect width="200" height="26" rx="13" fill="#0f172a" stroke="#ffb703" stroke-width="1"/>
    <circle cx="15" cy="13" r="4" fill="#ffb703" />
    <text x="28" y="17" fill="#ffb703" font-family="monospace" font-size="11" font-weight="700">3D PRINT ENGINE</text>
  </g>

  <!-- Left Column: Project Identity & Specs -->
  <g transform="translate(60, 115)">
    <text x="0" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="40" font-weight="800" letter-spacing="-1">AlttreMotion</text>
    <text x="0" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">Interactive 20,000 Fluid Particle Slicing &amp; Morphing Engine</text>

    <!-- Stack Chips -->
    <g transform="translate(0, 100)">
      
        <rect x="0" y="0" width="96" height="30" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="48" y="19" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">Three.js</text>
        
        <rect x="108" y="0" width="70" height="30" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="143" y="19" text-anchor="middle" fill="#a855f7" font-family="monospace" font-size="12" font-weight="600">GSAP</text>
        
        <rect x="190" y="0" width="105" height="30" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="242" y="19" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="12" font-weight="600">STLLoader</text>
        
        <rect x="307" y="0" width="70" height="30" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="342" y="19" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="600">WebGL</text>
        
    </g>

    <!-- Metrics Cards -->
    <g transform="translate(0, 160)">
      
        <g transform="translate(0, 0)">
          <rect width="145" height="60" rx="8" fill="#0f172a" stroke="#1e293b"/>
          <text x="14" y="24" fill="#64748b" font-family="monospace" font-size="10">PARTICLES</text>
          <text x="14" y="48" fill="#ffb703" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">20,000 Sim</text>
        </g>
        
        <g transform="translate(155, 0)">
          <rect width="145" height="60" rx="8" fill="#0f172a" stroke="#1e293b"/>
          <text x="14" y="24" fill="#64748b" font-family="monospace" font-size="10">PERFORMANCE</text>
          <text x="14" y="48" fill="#22c55e" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">60 FPS</text>
        </g>
        
        <g transform="translate(310, 0)">
          <rect width="145" height="60" rx="8" fill="#0f172a" stroke="#1e293b"/>
          <text x="14" y="24" fill="#64748b" font-family="monospace" font-size="10">GEOMETRY</text>
          <text x="14" y="48" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Raw STL</text>
        </g>
        
    </g>

    <!-- Detailed Highlights -->
    <g transform="translate(0, 255)">
      <text x="0" y="0" fill="#ffb703" font-family="monospace" font-size="11" font-weight="700">CORE SYSTEM ARCHITECTURE:</text>
      
        <text x="0" y="22" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">● Dynamic target vector interpolation with velocity damping...</text>
        
        <text x="0" y="42" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">● Continuous scroll depth mapped directly to layer-by-layer...</text>
        
        <text x="0" y="62" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">● Interactive 3D mouse momentum drag with viewport gyroscop...</text>
        
    </g>
  </g>

  <!-- Right Column: Bespoke Visual Representation -->
  <g transform="translate(680, 50)">
    
        <g transform="translate(120, 20)">
          <polygon points="70,10 130,10 115,60 85,60" fill="#24140a" stroke="#ffb703" stroke-width="2"/>
          <rect x="95" y="60" width="10" height="15" fill="#ffb703"/>
          <line x1="100" y1="75" x2="100" y2="160" stroke="#fb8500" stroke-width="4" stroke-dasharray="4,6"/>
          
          <g transform="translate(100, 230)">
            <ellipse cx="0" cy="0" rx="130" ry="35" fill="none" stroke="#fb8500" stroke-width="1.5" stroke-dasharray="3,10" opacity="0.6"/>
            <ellipse cx="0" cy="30" rx="110" ry="30" fill="none" stroke="#ffb703" stroke-width="1.5" stroke-dasharray="4,8" opacity="0.8"/>
            <ellipse cx="0" cy="60" rx="140" ry="40" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2,6" opacity="0.7"/>
            <circle cx="-50" cy="0" r="3" fill="#ffedd5"/>
            <circle cx="80" cy="-10" r="2.5" fill="#fde047"/>
            <circle cx="50" cy="40" r="3" fill="#fb923c"/>
            <circle cx="-20" cy="60" r="2.5" fill="#fed7aa"/>
          </g>

          <g transform="translate(-10, 200)">
            <rect x="0" y="0" width="220" height="4" fill="#00f2fe"/>
            <text x="140" y="-8" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">Z-SLICE: 0.16mm</text>
          </g>

          <ellipse cx="100" cy="330" rx="140" ry="25" fill="#1c0f07" stroke="#3f2314" stroke-width="2"/>
          <text x="100" y="348" text-anchor="middle" fill="#9a7158" font-family="monospace" font-size="10">THREE.JS VIRTUAL BUILD PLATE</text>
        </g>
        
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(60, 515)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#1e293b" stroke-width="1"/>
    <text x="0" y="22" fill="#64748b" font-family="monospace" font-size="11">REPOSITORY: Alttrest/AlttreMotion</text>
    <text x="400" y="22" fill="#64748b" font-family="monospace" font-size="11">MAINTAINER: Ali Turan (@Alttrest)</text>
    <text x="960" y="22" fill="#ffb703" font-family="monospace" font-size="11">● PRODUCTION VERIFIED</text>
  </g>
</svg>